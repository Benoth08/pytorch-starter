# Transfer learning, 2e temps (etape 8 du cours) : ResNet18 ImageNet, tete neuve + layer4 degele, deux taux d'apprentissage.
# Chaque YAML est une experience complete : celle-ci repart des poids ImageNet et degele layer4 des le debut
# (le notebook, a l'etape 8, fait tete seule puis layer4 a la suite ; ici on compare deux configurations).
data_dir: data/raw/neu_cls_flat
data_layout: class_folders
output_dir: outputs/resnet18_finetune
split_file: outputs/split.csv

image_size: 128
batch_size: 32
num_workers: 2
seed: 42

model_name: resnet18
pretrained: true
freeze_backbone: true
unfreeze_layers: [layer4]         # 8,4 M de parametres entrainables au lieu de 3 078
normalization: imagenet

epochs: 8
learning_rate: 0.001              # la tete, neuve
backbone_learning_rate: 0.0001    # layer4, pre-entraine : 10 fois moins
weight_decay: 0.0001
patience: 3
class_weighting: false
optimizer: adamw                  # adamw | sgd (sgd utilise aussi la cle momentum)
scheduler_factor: 0.5             # le pas d'apprentissage est multiplie par ce nombre quand la validation stagne...
scheduler_patience: 2             # ...plus de 2 epoques de suite

augment: [hflip, vflip]           # augmentations du train, dans l'ordre : hflip | vflip | rotate | brightness ; [] = aucune
onnx_opset: 18                    # version du catalogue d'operations ONNX a l'export (celle que le moteur de production connait)
