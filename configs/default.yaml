# Configuration de reference : CNN fait de zero, sur NEU-CLS range en dossiers de classes (cas B).
# Chaque cle est validee par src/vision_starter/config.py : une cle inconnue = erreur au demarrage.
data_dir: data/raw/neu_cls_flat
data_layout: class_folders        # class_folders | split_folders | csv
output_dir: outputs/simple_cnn
split_file: outputs/split.csv

image_size: 128
batch_size: 32
num_workers: 2                    # 0 si les workers posent probleme (notebook sous Windows)
val_fraction: 0.15
test_fraction: 0.15
seed: 42

model_name: simple_cnn            # simple_cnn | resnet18
normalization: dataset            # statistiques calculees sur le train

epochs: 15
learning_rate: 0.001
weight_decay: 0.0001
patience: 4
class_weighting: true
optimizer: adamw                  # adamw | sgd (sgd utilise aussi la cle momentum)
scheduler_factor: 0.5             # le pas d'apprentissage est multiplie par ce nombre quand la validation stagne...
scheduler_patience: 2             # ...plus de 2 epoques de suite

augment: [hflip, vflip]           # augmentations du train, dans l'ordre : hflip | vflip | rotate | brightness ; [] = aucune
onnx_opset: 18                    # version du catalogue d'operations ONNX a l'export (celle que le moteur de production connait)
